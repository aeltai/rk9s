# Kubewarden plugins for rk9s
# Policy enforcement and security for Kubernetes
#
# Dashboards:
#   :kubewarden         Policy servers, policies, and reports
#   :releases           GitHub releases (includes Kubewarden)
#
# Tab navigation (→/←):
#   ClusterPolicies ↔ Policies ↔ PolicyServers ↔ Reports

plugins:
  # --- Cluster Admission Policies ---
  kubewarden-policy-status:
    shortCut: Shift-I
    description: Policy status overview
    scopes:
      - clusteradmissionpolicies
    command: bash
    background: false
    args:
      - -c
      - |
        clear
        echo "=== Cluster Admission Policy: $NAME ==="
        echo ""
        CTX=""
        [ -n "$CONTEXT" ] && CTX="--context $CONTEXT"
        echo "--- Policy Details ---"
        kubectl $CTX get clusteradmissionpolicies.policies.kubewarden.io "$NAME" -o yaml | head -50
        echo ""
        echo "--- Policy Status ---"
        kubectl $CTX get clusteradmissionpolicies.policies.kubewarden.io "$NAME" -o jsonpath='{.status}' | jq . 2>/dev/null || echo "(no status)"
        echo ""
        echo "--- Related Policy Reports ---"
        kubectl $CTX get policyreports.wgpolicyk8s.io -A --no-headers 2>/dev/null | grep -i "$NAME" | head -10 || echo "(no reports)"
        echo ""
        echo "Press Enter to continue..."
        read -r

  kubewarden-policy-mode:
    shortCut: Shift-M
    description: Toggle protect/monitor mode
    scopes:
      - clusteradmissionpolicies
    command: bash
    background: false
    confirm: true
    args:
      - -c
      - |
        CTX=""
        [ -n "$CONTEXT" ] && CTX="--context $CONTEXT"
        MODE=$(kubectl $CTX get clusteradmissionpolicies.policies.kubewarden.io "$NAME" -o jsonpath='{.spec.mode}')
        if [ "$MODE" = "protect" ]; then
          NEW_MODE="monitor"
        else
          NEW_MODE="protect"
        fi
        echo "Switching $NAME from $MODE to $NEW_MODE..."
        kubectl $CTX patch clusteradmissionpolicies.policies.kubewarden.io "$NAME" --type=merge -p "{\"spec\":{\"mode\":\"$NEW_MODE\"}}"
        echo "Done. New mode: $NEW_MODE"

  # --- Policy Servers ---
  kubewarden-server-status:
    shortCut: Shift-I
    description: Policy server overview
    scopes:
      - policyservers
    command: bash
    background: false
    args:
      - -c
      - |
        clear
        echo "=== Policy Server: $NAME ==="
        echo ""
        CTX=""
        [ -n "$CONTEXT" ] && CTX="--context $CONTEXT"
        echo "--- Server Config ---"
        kubectl $CTX get policyservers.policies.kubewarden.io "$NAME" -o yaml | head -40
        echo ""
        echo "--- Server Pods ---"
        kubectl $CTX get pods -A -l "app=kubewarden-policy-server-$NAME" 2>/dev/null || echo "(no pods found)"
        echo ""
        echo "--- Assigned Policies ---"
        kubectl $CTX get clusteradmissionpolicies.policies.kubewarden.io -o jsonpath='{range .items[?(@.spec.policyServer=="'$NAME'")]}{.metadata.name}{"\n"}{end}' 2>/dev/null || echo "(none)"
        echo ""
        echo "Press Enter to continue..."
        read -r

  kubewarden-server-scale:
    shortCut: Shift-S
    description: Scale policy server
    scopes:
      - policyservers
    command: bash
    background: false
    args:
      - -c
      - |
        CTX=""
        [ -n "$CONTEXT" ] && CTX="--context $CONTEXT"
        CURRENT=$(kubectl $CTX get policyservers.policies.kubewarden.io "$NAME" -o jsonpath='{.spec.replicas}')
        echo "Current replicas: $CURRENT"
        echo -n "New replica count: "
        read -r NEW
        if [ -n "$NEW" ]; then
          kubectl $CTX patch policyservers.policies.kubewarden.io "$NAME" --type=merge -p "{\"spec\":{\"replicas\":$NEW}}"
          echo "Scaled to $NEW replicas"
        fi

  # --- Policy Reports ---
  kubewarden-report-details:
    shortCut: Shift-I
    description: Report details
    scopes:
      - policyreports
    command: bash
    background: false
    args:
      - -c
      - |
        clear
        echo "=== Policy Report: $NAME ==="
        echo ""
        CTX=""
        [ -n "$CONTEXT" ] && CTX="--context $CONTEXT"
        kubectl $CTX -n "$NAMESPACE" get policyreports.wgpolicyk8s.io "$NAME" -o yaml
        echo ""
        echo "Press Enter to continue..."
        read -r
